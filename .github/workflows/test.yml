name: Tests

on:
  push:
    branches: [main, feat/context-memory-benchmark]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [18, 20]
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run tests
        run: npm test

      - name: npm pack dry-run
        run: npm pack --dry-run

      - name: Create tarball
        run: npm pack

      - name: Install from tarball
        run: |
          TARBALL=$(ls *.tgz)
          npm install -g "$TARBALL"

      - name: CLI smoke tests
        run: |
          orquestrador-maestro version
          orquestrador-maestro memory --help
          orquestrador-maestro memory status
          orquestrador-maestro benchmark --help
          orquestrador-maestro context brief --help

      - name: Cleanup
        if: always()
        run: npm uninstall -g @iapro/orquestrador-maestro-cli 2>/dev/null || true
